name: MeshShift Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      prerelease:
        description: Publish as an unsigned internal prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PNPM_VERSION: 10.30.1

jobs:
  build:
    name: Build / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win-x64
            runner: windows-2025
            target: win
            arch: x64
          - name: linux-x64
            runner: ubuntu-22.04
            target: linux
            arch: x64
          - name: macos-x64
            runner: macos-15-intel
            target: mac
            arch: x64
          - name: macos-arm64
            runner: macos-15
            target: mac
            arch: arm64
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate tag version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "push" ]; then
            test "v${VERSION}" = "${GITHUB_REF_NAME}"
          fi
      - name: Build desktop app
        run: pnpm run desktop:build
      - name: Verify desktop inputs
        run: pnpm run desktop:verify
      - name: Configure Windows signing
        if: matrix.target == 'win' && vars.MESHSHIFT_SIGNING_READY == 'true'
        shell: bash
        env:
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> "$GITHUB_ENV"
          echo "CSC_LINK=$WINDOWS_CSC_LINK" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=$WINDOWS_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Configure Apple signing and notarization
        if: matrix.target == 'mac' && vars.MESHSHIFT_SIGNING_READY == 'true'
        shell: bash
        env:
          APPLE_API_KEY_VALUE: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID_VALUE: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_VALUE: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID_VALUE: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_VALUE: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_VALUE: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=$APPLE_API_KEY_VALUE" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID_VALUE" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER_VALUE" >> "$GITHUB_ENV"
          echo "APPLE_ID=$APPLE_ID_VALUE" >> "$GITHUB_ENV"
          echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD_VALUE" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_VALUE" >> "$GITHUB_ENV"
      - name: Package desktop artifact
        shell: bash
        run: pnpm exec electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ vars.MESHSHIFT_SIGNING_READY == 'true' && 'true' || 'false' }}
      - name: Prepare public release asset
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p artifacts/release-public
          case "${{ matrix.name }}" in
            win-x64) expected="artifacts/desktop/MeshShift-${VERSION}-win-x64.exe" ;;
            linux-x64) expected="artifacts/desktop/MeshShift-${VERSION}-linux-x64.tar.gz" ;;
            macos-x64) expected="artifacts/desktop/MeshShift-${VERSION}-mac-x64.dmg" ;;
            macos-arm64) expected="artifacts/desktop/MeshShift-${VERSION}-mac-arm64.dmg" ;;
            *) echo "Unsupported release target: ${{ matrix.name }}" >&2; exit 1 ;;
          esac
          test -f "$expected"
          cp -- "$expected" artifacts/release-public/
          test "$(find artifacts/release-public -maxdepth 1 -type f | wc -l)" -eq 1
      - name: Upload platform artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.name }}
          path: artifacts/release-public/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Aggregate, attest, and publish
    needs: build
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.prerelease == true)
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: artifacts/release-assets
          merge-multiple: true
      - name: Generate release checksums
        run: node scripts/make-checksums.mjs --dir artifacts/release-assets
      - name: Generate artifact provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: artifacts/release-assets/SHA256SUMS.txt
      - name: Verify release asset set
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$(find artifacts/release-assets -maxdepth 1 -type f | wc -l)" -eq 6
          test -f "artifacts/release-assets/MeshShift-${VERSION}-linux-x64.tar.gz"
          test -f "artifacts/release-assets/MeshShift-${VERSION}-linux-x86_64.AppImage"
          test -f "artifacts/release-assets/MeshShift-${VERSION}-mac-arm64.dmg"
          test -f "artifacts/release-assets/MeshShift-${VERSION}-mac-x64.dmg"
          test -f "artifacts/release-assets/MeshShift-${VERSION}-win-x64.exe"
          test -f artifacts/release-assets/SHA256SUMS.txt
      - name: Create published GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PRERELEASE_FLAG=''
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ] || \
             [ "${{ vars.MESHSHIFT_SIGNING_READY }}" != 'true' ] || \
             [ "${{ vars.MESHSHIFT_NOTARIZATION_READY }}" != 'true' ]; then
            PRERELEASE_FLAG='--prerelease'
          fi
          mapfile -d '' RELEASE_FILES < <(
            find artifacts/release-assets -maxdepth 1 -type f -print0
          )
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" --clobber "${RELEASE_FILES[@]}"
          else
            gh release create "v${VERSION}" --title "MeshShift ${VERSION}" \
              --generate-notes ${PRERELEASE_FLAG} "${RELEASE_FILES[@]}"
          fi
